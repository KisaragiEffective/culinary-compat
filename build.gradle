plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.named('compileGameTestJava', JavaCompile).configure {
    options.compilerArgs += ['-proc:none']
}

// Generate a deterministic empty structure without shipping test assets in main.
tasks.named('processGameTestResources').configure {
    exclude 'data/culinarycompat/structure/empty.nbt'
    doLast {
        def target = new File(destinationDir, 'data/culinarycompat/structure/empty.nbt')
        target.parentFile.mkdirs()
        new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(target))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            3.times { out.writeInt(5) }
            out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
            out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
            ['blocks', 'entities'].each { name ->
                out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0)
            }
            out.writeByte(0)
        }
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/gameTest/java/**/*.java'
        eclipse()
        removeUnusedImports()
        importOrder('java', 'javax', 'net', 'com', 'org', '')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

neoForge {
    version = neoforge_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run-gametest')
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            if (providers.gradleProperty('gameTests').isPresent()) sourceSet sourceSets.gameTest
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // These integrations are required by the block tests; missing mods must fail
    // the run rather than turn coverage into silently skipped tests.
    gameTestRuntimeOnly 'maven.modrinth:farmers-delight:XTVZDOol'
    gameTestRuntimeOnly 'maven.modrinth:cooking-for-blockheads:MQCIy6VF'
    gameTestRuntimeOnly 'maven.modrinth:balm:CquiaiDj'
    gameTestRuntimeOnly 'maven.modrinth:ae2:KDnFUmMm'
    gameTestRuntimeOnly 'maven.modrinth:guideme:hFpGwC6q'
    // All artifacts below target Minecraft 1.21.1 and NeoForge. They remain optional.
    compileOnly 'maven.modrinth:farmers-delight:XTVZDOol'
    compileOnly 'maven.modrinth:cooking-for-blockheads:MQCIy6VF'
    compileOnly 'maven.modrinth:balm:CquiaiDj'
    compileOnly 'maven.modrinth:storage-delight:7I2UUB9l'
    compileOnly 'maven.modrinth:ae2:KDnFUmMm'
    compileOnly 'maven.modrinth:jei:iv3KiVkE'
    compileOnly 'maven.modrinth:emi:5sIPA1To'
    compileOnly 'maven.modrinth:patchouli:BIogJv2D'
    compileOnly 'maven.modrinth:refined-storage:lHHiI26k'
    compileOnly 'maven.modrinth:ends-delight:YTApg6Hl'
    compileOnly 'maven.modrinth:enders-delight:5S67w5gs'
    compileOnly 'curse.maven:pamhc2foodcore-372534:6919485'
    compileOnly 'curse.maven:pamhc2crops-361385:8064883'
    compileOnly 'curse.maven:pamhc2trees-365460:7847533'
    compileOnly 'curse.maven:pamhc2foodextended-402231:6221521'
    compileOnly 'curse.maven:croptopia-415438:7958876'
    compileOnly 'curse.maven:twilights-flavors-delight-871735:9103719'
    compileOnly 'curse.maven:my-nethers-delight-1003673:8854319'

    // Opt into the principal integrations when exercising development runs.
    if (providers.gradleProperty('compatTest').isPresent()) {
        runtimeOnly 'maven.modrinth:farmers-delight:XTVZDOol'
        runtimeOnly 'maven.modrinth:cooking-for-blockheads:MQCIy6VF'
        runtimeOnly 'maven.modrinth:balm:CquiaiDj'
        runtimeOnly 'maven.modrinth:ae2:KDnFUmMm'
        runtimeOnly 'maven.modrinth:guideme:hFpGwC6q'
        runtimeOnly 'maven.modrinth:patchouli:BIogJv2D'
        runtimeOnly 'maven.modrinth:storage-delight:7I2UUB9l'
        runtimeOnly 'maven.modrinth:ends-delight:YTApg6Hl'
        runtimeOnly 'maven.modrinth:enders-delight:5S67w5gs'
        runtimeOnly 'curse.maven:pamhc2foodcore-372534:6919485'
        runtimeOnly 'curse.maven:pamhc2crops-361385:8064883'
        runtimeOnly 'curse.maven:pamhc2trees-365460:7847533'
        runtimeOnly 'curse.maven:pamhc2foodextended-402231:6221521'
        runtimeOnly 'curse.maven:croptopia-415438:7958876'
        runtimeOnly 'maven.modrinth:epherolib:irMqtqYp'
    }
    if (providers.gradleProperty('viewers').isPresent()) {
        runtimeOnly 'maven.modrinth:jei:iv3KiVkE'
        runtimeOnly 'maven.modrinth:mezzconfig:idpM3DKC'
        runtimeOnly 'maven.modrinth:emi:5sIPA1To'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories { maven { url = layout.projectDirectory.dir('mcmodsrepo') } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
