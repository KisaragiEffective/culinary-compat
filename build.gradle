plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

spotless {
    java {
        target 'src/main/java/**/*.java'
        eclipse()
        removeUnusedImports()
        importOrder('java', 'javax', 'net', 'com', 'org', '')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

neoForge {
    version = neoforge_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // All artifacts below target Minecraft 1.21.1 and NeoForge. They remain optional.
    compileOnly 'maven.modrinth:farmers-delight:XTVZDOol'
    compileOnly 'maven.modrinth:cooking-for-blockheads:MQCIy6VF'
    compileOnly 'maven.modrinth:balm:CquiaiDj'
    compileOnly 'maven.modrinth:storage-delight:7I2UUB9l'
    compileOnly 'maven.modrinth:ae2:KDnFUmMm'
    compileOnly 'maven.modrinth:jei:iv3KiVkE'
    compileOnly 'maven.modrinth:emi:5sIPA1To'
    compileOnly 'maven.modrinth:patchouli:BIogJv2D'
    compileOnly 'maven.modrinth:refined-storage:lHHiI26k'
    compileOnly 'maven.modrinth:ends-delight:YTApg6Hl'
    compileOnly 'maven.modrinth:enders-delight:5S67w5gs'
    compileOnly 'curse.maven:pamhc2foodcore-372534:6919485'
    compileOnly 'curse.maven:pamhc2crops-361385:8064883'
    compileOnly 'curse.maven:pamhc2trees-365460:7847533'
    compileOnly 'curse.maven:pamhc2foodextended-402231:6221521'
    compileOnly 'curse.maven:croptopia-415438:7958876'
    compileOnly 'curse.maven:twilights-flavors-delight-871735:9103719'
    compileOnly 'curse.maven:my-nethers-delight-1003673:8854319'

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories { maven { url = layout.projectDirectory.dir('mcmodsrepo') } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
