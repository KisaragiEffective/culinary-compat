plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.diffplug.spotless' version '6.25.0'
}

spotless {
    java {
        target 'src/main/java/**/*.java'
        eclipse()
        removeUnusedImports()
        importOrder('java', 'javax', 'net', 'com', 'org', '')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Loaded only by the dedicated GameTest run, never packaged in the mod jar.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.named('compileGameTestJava', JavaCompile).configure {
    options.compilerArgs += ['-proc:none']
}

// Generate a deterministic empty structure without shipping test assets in main.
tasks.named('processGameTestResources').configure {
    doLast {
        def target = new File(destinationDir, 'data/culinarycompat/structures/empty.nbt')
        target.parentFile.mkdirs()
        new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(target))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3465)
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            3.times { out.writeInt(5) }
            out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
            out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
            ['blocks', 'entities'].each { name ->
                out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0)
            }
            out.writeByte(0)
        }
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation, compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('run-gametest')
            mods {
                "${mod_id}" {
                    source sourceSets.gameTest
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("curse.maven:farmers-delight-398521:7801523")
    compileOnly fg.deobf("curse.maven:pamhc2foodcore-372534:5097798")
    compileOnly fg.deobf("curse.maven:pamhc2crops-361385:4687624")
    compileOnly fg.deobf("curse.maven:pamhc2trees-365460:4625518")
    compileOnly fg.deobf("curse.maven:pamhc2foodextended-402231:5147171")
    compileOnly fg.deobf("curse.maven:jei-238222:7920915")
    compileOnly fg.deobf("curse.maven:emi-580555:6420945")
    compileOnly fg.deobf("curse.maven:cooking-for-blockheads-231484:7454483")
    compileOnly fg.deobf("curse.maven:storage-delight-forge-979761:7946523")
    compileOnly fg.deobf("curse.maven:balm-531761:7420617")
    compileOnly fg.deobf("curse.maven:applied-energistics-2-223794:7148487")
    compileOnly fg.deobf("curse.maven:refined-storage-243076:4844585")
    compileOnly fg.deobf("curse.maven:patchouli-306770:7731017")
    compileOnly fg.deobf("curse.maven:ends-delight-662675:6180421")
    compileOnly fg.deobf("curse.maven:enders-delight-827163:6474007")
    compileOnly fg.deobf("curse.maven:nethers-delight-496394:4736227")
    compileOnly fg.deobf("curse.maven:twilights-flavors-delight-871735:8046920")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // These integrations are required by the block tests; missing mods must fail
    // the run rather than turn coverage into silently skipped tests.
    gameTestRuntimeOnly fg.deobf("curse.maven:farmers-delight-398521:7801523")
    gameTestRuntimeOnly fg.deobf("curse.maven:cooking-for-blockheads-231484:7454483")
    gameTestRuntimeOnly fg.deobf("curse.maven:balm-531761:7420617")
    gameTestRuntimeOnly fg.deobf("curse.maven:applied-energistics-2-223794:7148487")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
