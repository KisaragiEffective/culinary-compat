modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/smokahs/Culinary-Compat/issues"

[[mixins]]
    config="culinarycompat.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://curseforge.com/minecraft/mc-mods/culinary-compat"
logoFile="icon.png"
authors="${mod_authors}"
credits="Pam, vectorwing, BlayTheNinth, Pixel_1101, ItsSebastrn, ACCBDD (Farmer's Croptopia recipes, Apache-2.0)"
description='''${mod_description}'''

[[dependencies.culinarycompat]]
